name: Publish Maven to GitHub (mvn-repo)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.0.1, leave empty to use tag/ref name)'
        required: false
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and Publish Maven Artifacts to local repo
        run: |
          chmod +x gradlew
          ./gradlew publishMavenPublicationToLocalRepoRepository
        env:
          LIB_VERSION: ${{ github.event.inputs.version || github.ref_name }}

      - name: Deploy to mvn-repo branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: mvn-repo
          publish_dir: ./build/repo
          keep_files: true